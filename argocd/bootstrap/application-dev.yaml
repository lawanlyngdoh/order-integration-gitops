apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-integration-dev
  namespace: argocd
spec:
  project: order-integration

  source:
    repoURL: https://github.com/lawanlyngdoh/order-integration-gitops.git
    targetRevision: main
    path: environments/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: order-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

  revisionHistoryLimit: 10