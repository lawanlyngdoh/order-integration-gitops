name: Promote to production

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.8

      - name: Render and validate environment policies
        run: ./scripts/validate-manifests.sh

      - name: Validate Kubernetes schemas
        run: |
          docker run \
            --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict \
            -summary \
            -exit-on-error \
            /workspace/.rendered

  promote:
    name: Approve and promote production
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment: production

    permissions:
      contents: write

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify deployment is from main
        run: |
          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Production deployments must be initiated from the latest main commit"
            exit 1
          fi

      - name: Verify promotion is forward-only
        run: |
          if git ls-remote \
            --exit-code \
            --heads origin production >/dev/null 2>&1
          then
            git fetch \
              origin \
              production:refs/remotes/origin/production

            if ! git merge-base \
              --is-ancestor origin/production HEAD
            then
              echo "Refusing to move production backwards or to unrelated history"
              exit 1
            fi
          fi

      - name: Advance production release branch
        run: git push origin "HEAD:refs/heads/production"