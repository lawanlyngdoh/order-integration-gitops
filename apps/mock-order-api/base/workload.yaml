apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-order-api
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-order-api
  labels:
    app.kubernetes.io/name: mock-order-api
    app.kubernetes.io/component: downstream-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-order-api
        app.kubernetes.io/component: downstream-simulator
    spec:
      serviceAccountName: mock-order-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: wiremock
          image: wiremock/wiremock
          args:
            - --verbose
            - --disable-gzip

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
              readOnly: true
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: mappings
          configMap:
            name: mock-order-api-mappings
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: mock-order-api
  labels:
    app.kubernetes.io/name: mock-order-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-order-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP