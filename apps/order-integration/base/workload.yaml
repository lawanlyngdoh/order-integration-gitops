apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-integration
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-integration
  labels:
    app.kubernetes.io/name: order-integration
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-integration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-integration
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: order-integration
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: order-integration
          image: ghcr.io/lawanlyngdoh/order-integration-service
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: order-integration-config

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 16Mi

---
apiVersion: v1
kind: Service
metadata:
  name: order-integration
  labels:
    app.kubernetes.io/name: order-integration
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-integration
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP